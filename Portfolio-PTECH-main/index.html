<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="shortcut icon" href="img/assets/icon.png" type="image/x-icon" />
    <title>Portfólio Ptech</title>
    <style>
      /* Fundo com vídeo do YouTube */
      .youtube-bg {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: -2;
        overflow: hidden;
      }

      .youtube-bg iframe {
        width: 100vw;
        height: 100vh;
        border: none;
        pointer-events: none; /* Impede cliques no player */
      }

      /* Overlay para escurecer e simular opacidade baixa */
      .overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0, 0, 0, 0.55); /* Ajuste este valor para mais ou menos escuro */
        z-index: -1;
      }

      /* Reset e estilo base */
      body, html {
        margin: 0;
        padding: 0;
        height: 100%;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        color: white;
      }

      /* Barra de navegação */
      nav {
        position: relative;
        z-index: 10;
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 1rem 2rem;
        background-color: rgba(0, 0, 0, 0.4);
        backdrop-filter: blur(6px);
        color: white;
      }

      nav .logo h1 {
        margin: 0;
        font-size: 1.6rem;
      }

      .menu {
        display: flex;
        list-style: none;
        margin: 0;
        padding: 0;
      }

      .menu li {
        margin-left: 1.8rem;
      }

      .menu a {
        color: white;
        text-decoration: none;
        font-weight: 600;
        font-size: 1.1rem;
      }

      .menu a:hover {
        text-decoration: underline;
      }

      /* Conteúdo central */
      .content {
        position: relative;
        z-index: 5;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        text-align: center;
        padding: 0 1.5rem;
      }

      .text-content h1 {
        font-size: 3.2rem;
        margin-bottom: 1rem;
        text-shadow: 0 2px 6px rgba(0, 0, 0, 0.7);
      }

      .text-content p {
        font-size: 1.4rem;
        margin-bottom: 1.2rem;
        text-shadow: 0 1px 4px rgba(0, 0, 0, 0.7);
      }

      .text-content span {
        font-size: 1.2rem;
        font-style: italic;
        text-shadow: 0 1px 4px rgba(0, 0, 0, 0.7);
      }

      /* Responsividade */
      @media (max-width: 768px) {
        .text-content h1 {
          font-size: 2.2rem;
        }
        .text-content p {
          font-size: 1.1rem;
        }
        nav {
          flex-direction: column;
          gap: 1rem;
        }
        .menu li {
          margin-left: 1rem;
          margin-right: 1rem;
        }
      }
    </style>
  </head>
  <body>
    <!-- Vídeo do YouTube de fundo -->
    <div class="youtube-bg">
      <iframe
        src="https://www.youtube.com/embed/iC98pbCdWYw?autoplay=1&mute=1&controls=0&showinfo=0&disablekb=1&modestbranding=1&playsinline=1"
        allow="autoplay; encrypted-media"
        title="Vídeo de Fórmula 1 de fundo"
      ></iframe>
    </div>

    <!-- Overlay escuro para melhorar legibilidade -->
    <div class="overlay"></div>

    <!-- Navegação -->
    <nav>
      <div class="logo">
        <h1>Portfólio Ptech</h1>
      </div>
      <ul class="menu">
        <li><a href="#">Início</a></li>
        <li><a href="ptech.html">Ptech</a></li>
      </ul>
    </nav>

    <!-- Conteúdo principal -->
    <div class="content">
      <div class="text-content">
        <h1>Encontro com Empresas</h1>
        <p>Portfólio ETEC Fernando Prestes</p>
        <span>Arthur Mendes Entsev</span>
      </div>
    </div>
  </body>
</html>
